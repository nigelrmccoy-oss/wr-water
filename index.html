<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WR-WATER v0.3.1 · Region of Waterloo water supply SCADA trainer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1C5 6 3 8.5 3 10.5a5 5 0 0 0 10 0C13 8.5 11 6 8 1z%22 fill=%22%233fa7ff%22/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }</script>
</head>
<body>
<header id="top">
  <div class="brand">WR-WATER <span>v0.3.1</span><small>Region of Waterloo water supply · operator trainer (unofficial)</small></div>
  <nav id="tabs">
    <button data-view="board" class="on">Master board</button>
    <button data-view="net">Transfers</button>
    <button data-view="map">3D overview</button>
    <button data-view="alarms">Alarms <b id="almCount">0</b></button>
    <button data-view="costs">Daily totals &amp; cost</button>
    <button data-view="help">Help / data</button>
  </nav>
  <div id="clock"><span id="simDate">—</span> <b id="simTime">--:--</b> <span id="tou" class="tou">—</span> <span id="ici" class="ici off">ICI</span></div>
  <div id="speed">
    <button data-speed="0" title="Pause">❚❚</button><button data-speed="1">1×</button><button data-speed="10">10×</button><button data-speed="60" class="on">60×</button><button data-speed="300">300×</button><button data-speed="900">900×</button>
  </div>
  <button id="btnSave" title="Save session to this browser (localStorage)">💾 Save</button><button id="btnResume" title="Resume the last saved session">⟲ Resume</button>
  <select id="scenarioSel"><option value="">Free play (no scenario)</option></select>
</header>
<div id="kpis"></div>
<main>
  <section id="view-board" class="view on"></section>
  <section id="view-net" class="view"></section>
  <section id="view-map" class="view"><div id="mapWrap"><canvas id="map3d"></canvas><div id="mapLegend"></div><div id="mapTip"></div></div></section>
  <section id="view-alarms" class="view"></section>
  <section id="view-costs" class="view"></section>
  <section id="view-help" class="view"></section>
</main>
<aside id="faceplate" class="hidden"></aside>
<aside id="scenarioPanel" class="hidden"></aside>
<button id="scShow" class="hidden" title="Show scenario panel">Scenario ▸</button>
<footer id="alarmBanner"></footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
